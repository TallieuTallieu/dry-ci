# Builds the CI image docker/php and publishes it as
# ghcr.io/tallieutallieu/dry-ci-php:8.4 (and :8.4-<commit> to pin or roll back).
# Weekly rebuilds pick up PHP and Debian security patches.
name: image

on:
  push:
    branches: [main]
    paths: ['docker/**', '.github/workflows/image.yml']
  pull_request:
    paths: ['docker/**', '.github/workflows/image.yml']
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  php:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: docker/php
          platforms: linux/amd64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/tallieutallieu/dry-ci-php:8.4
            ghcr.io/tallieutallieu/dry-ci-php:8.4-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm ghcr.io/tallieutallieu/dry-ci-php:8.4 sh -c \
            'php -v && php -m | grep -xE "gd|exif|imagick|zip" | wc -l | grep -qx 4 && composer --version && git --version'
